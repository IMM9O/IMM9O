name: Latest blog post workflow
on:
  schedule:
    # Every Monday at 00:00 UTC. The blog publishes one post a week.
    - cron: '0 0 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          max_post_count: '5'
          feed_list: 'https://imm9o.github.io/rss.xml'
          committer_username: 'IMM9O'
          committer_email: '11165508+IMM9O@users.noreply.github.com'
